name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs. Added because GitHub throttled webhook delivery during an Actions
  # incident and pull_request events stopped starting workflows at all — dispatch
  # goes through the API instead and is unaffected. Useful beyond the outage too:
  # re-running CI no longer needs an empty commit.
  workflow_dispatch:

# Least privilege: the build/test job only needs to read the repo. Uploading test
# results uses the artifact API, which doesn't need extra token scopes.
permissions:
  contents: read

# Cancel an in-progress run when a *PR branch* is pushed again — but never cancel a
# push to main, or that commit is left with a permanently "cancelled" status (masking
# breakage and putting holes in CI-status bisection).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: Jetty.xcodeproj
  SCHEME: Jetty

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30   # a wedged xcodebuild (a documented failure mode) shouldn't burn 6h of 10x-billed runner time
    steps:
      # Actions are pinned to immutable commit SHAs: a mutable tag like @v4 can be
      # repointed at tampered code after the fact, a commit SHA cannot. Same
      # pin-and-verify discipline zai-code-review.yml already uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here runs git after checkout

      # The Haiku trash icons come from Haiku's TrackerIcons.rdef, whose header is
      # the Open Tracker License (Be Incorporated). The credits and the notices the
      # app bundles must quote that notice, not a substitute license. The notices
      # are maintained by hand, so also fail when a SwiftPM pin has no entry there.
      - name: Check license notices
        run: |
          for f in ICON-CREDITS.md Jetty/Resources/Third-Party-Notices.txt; do
            grep -q 'Copyright (c) 1991-2000, Be Incorporated' "$f" \
              || { echo "::error::$f lacks the Open Tracker License notice for the Haiku icons"; exit 1; }
          done
          python3 -I - <<'EOF'
          import json, sys
          resolved = "Jetty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          notices = "Jetty/Resources/Third-Party-Notices.txt"
          lines = open(notices, encoding="utf-8").read().splitlines()
          missing = [pin["location"] for pin in json.load(open(resolved))["pins"]
                     if f"Source: {pin['location']}" not in lines]
          for location in missing:
              print(f"::error::{location} is pinned in Package.resolved but has no Source: line in {notices}")
          sys.exit(1 if missing else 0)
          EOF

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'   # pin so a runner-image bump can't change the toolchain (Liquid Glass needs Xcode 26)

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify

      # Third-Party-Notices.txt reaches Contents/Resources through the synchronized
      # Jetty/ group; check the test host app the build just produced.
      - name: Check notices in the built app
        run: |
          NOTICES="$RUNNER_TEMP/DerivedData/Build/Products/Debug/Jetty.app/Contents/Resources/Third-Party-Notices.txt"
          test -s "$NOTICES" || { echo "::error::Third-Party-Notices.txt missing from Jetty.app"; exit 1; }
          for sentinel in 'Open Tracker License' 'Weather data by Open-Meteo.com'; do
            grep -qF "$sentinel" "$NOTICES" || { echo "::error::Third-Party-Notices.txt in Jetty.app lacks '$sentinel'"; exit 1; }
          done

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
